name: Apply audio tuning once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audio-tuning-once.yml"

permissions:
  contents: write

jobs:
  apply-audio-tuning:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update audio balance
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("source/main.cpp")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "const int MUSIC_VOLUME = 20;": "const int MUSIC_VOLUME = 54;",
              "// This raises the complete output by 25% while preserving the balance\n// between background music and UI effects. Samples are clamped to the": "// This raises the complete output by 45%. Music is slightly compensated\n// so UI effects gain a little more presence. Samples are clamped to the",
              "const int MASTER_OUTPUT_GAIN_PERCENT = 130;": "const int MASTER_OUTPUT_GAIN_PERCENT = 145;",
              "// Raise the complete mixed output (music + SFX) by 25%.": "// Raise the complete mixed output (music + SFX) by 45%.",
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit audio tuning
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source/main.cpp
          git diff --cached --check
          git commit -m "Tune audio balance"
          git push origin main
