name: Update v1.2.0 release notes once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    steps:
      - name: Remove bundled-music references from v1.2.0 release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'PokeDoku-NX-release-maintenance'
          }

          req = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/releases/tags/v1.2.0',
              headers=headers
          )
          with urllib.request.urlopen(req) as r:
              release = json.load(r)

          body = release.get('body') or ''
          body = body.replace('- The release ZIP includes a default music selection.\r\n', '- No default music files are included in the release ZIP.\r\n')
          body = body.replace('- You can remove or replace the included tracks.\r\n', '')
          body = body.replace('You can also install only the `.nro`, but the included background music will only be available if the `music` folder is copied as well.', 'You can also install only the `.nro`. To use background music, add your own `.ogg` or `.mp3` files to the `music` folder.')
          body = body.replace('- **Default background music** — music arrangements from:\r\n  https://www.youtube.com/channel/UCCOBBs4V4WPAFR_G30W6kLw\r\n\r\n', '')

          payload = json.dumps({'body': body}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/{release['id']}",
              data=payload,
              headers={**headers, 'Content-Type': 'application/json'},
              method='PATCH'
          )
          with urllib.request.urlopen(req) as r:
              updated = json.load(r)

          print(updated['html_url'])
          PY
